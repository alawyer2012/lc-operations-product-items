<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LC Operations Items</title>
    <meta
      name="description"
      content="Leasing Center operations items: current escalations and what is releasing."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232a9d8f' rx='24' width='100' height='100'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css?v=20260918" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="masthead">
      <div class="masthead__brand">
        <p class="eyebrow">Leasing Center</p>
        <h1>Operations items</h1>
      </div>
      <div class="masthead__meta" id="masthead-meta"></div>
    </header>

    <nav class="tabs" aria-label="Operations sections">
      <a class="tabs__link is-active" href="#escalations" data-tab="escalations">Escalations</a>
      <a class="tabs__link" href="#releases" data-tab="releases">What’s releasing</a>
    </nav>

    <main id="main">
      <section id="escalations" class="panel" data-panel="escalations">
        <div class="filters" role="group" aria-label="Filter escalations">
          <button type="button" class="chip" data-filter="p1">P1</button>
          <button type="button" class="chip" data-filter="p2">P2</button>
          <button type="button" class="chip is-active" data-filter="all">All tickets</button>
        </div>
        <div id="issue-board"></div>
        <p class="empty" id="issue-empty" hidden>No items match this filter.</p>
      </section>

      <section id="releases" class="panel" data-panel="releases" hidden>
        <a
          class="release-banner"
          id="jira-releasing-banner"
          href="https://entrata.atlassian.net/jira/dashboards/16707"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="release-banner__eyebrow">Live in Jira</span>
          <span class="release-banner__copy">
            <strong>What’s Releasing dashboard</strong>
            <span>LC + VOIP ship list. Open this for the current cadence.</span>
          </span>
          <span class="release-banner__cta">Open Jira</span>
        </a>
        <div id="release-board"></div>
        <p class="empty" id="release-empty" hidden>
          Floor-impact notes will land here. Until then, use the Jira dashboard above.
        </p>
      </section>
    </main>

    <noscript>
      <p class="noscript">JavaScript is required to render items from <code>data/dashboard.js</code>.</p>
    </noscript>

    <script src="data/dashboard.js?v=20260918"></script>
    <script src="assets/app.js?v=20260918"></script>
  </body>
</html>
